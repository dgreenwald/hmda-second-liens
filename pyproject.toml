[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmda-second-liens"
version = "0.1.0"
description = "Validated classifiers for imputing HMDA lien status, 1990-2016."
authors = [
    {name = "Dan Greenwald", email = "greenw2@gmail.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dgreenwald-py-tools[datasets]>=0.2.4,<1.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.2,<2.0",
    "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/dgreenwald/hmda-second-liens"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
